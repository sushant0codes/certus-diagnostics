services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: certus_diagnostics
      MYSQL_USER: certus
      MYSQL_PASSWORD: certus_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./certusServer/api/hostinger_database_setup.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./certusServer
    environment:
      APP_ENV: development
      DB_HOST: mysql
      DB_NAME: certus_diagnostics
      DB_USER: certus
      DB_PASS: certus_dev_password
    ports:
      - "8080:80"
    volumes:
      - ./certusServer/api:/var/www/html/api
      - ./certusServer/api/index.php:/var/www/html/index.php:ro
      - report_uploads:/var/www/html/api/public/uploads
    depends_on:
      mysql:
        condition: service_healthy

  client:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    volumes:
      - ./Certus-Client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - api

  admin:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
      VITE_UPLOAD_BASE_URL: http://localhost:8080/public/uploads
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "5174:5174"
    volumes:
      - ./Certus-Admin:/app
      - admin_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  mysql_data:
  report_uploads:
  client_node_modules:
  admin_node_modules:
